name: Build LineageOS 18.1 (gta2slte)

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Mục tiêu build (mặc định: bacon)'
        required: true
        default: 'bacon'
        type: choice
        options:
          - bacon
          - systemimage
          - bootimage

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Dọn dẹp tối đa ổ đĩa (~80GB+ trống) và cấu hình 1GB Swap
        run: |
          echo "=== Dung lượng trước khi dọn ==="
          df -h / /mnt

          sudo swapoff -a || true
          sudo systemctl stop docker docker.socket containerd 2>/dev/null || true
          sudo rm -rf /mnt/* /mnt/.[!.]* /mnt/..?* 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet \
                       /usr/local/lib/android \
                       /opt/ghc \
                       /opt/hostedtoolcache \
                       /usr/local/share/boost \
                       /usr/local/share/powershell \
                       /usr/local/share/chromium \
                       /usr/local/share/vcpkg \
                       /usr/local/share/phantomjs* \
                       /usr/local/lib/node_modules \
                       /usr/share/miniconda \
                       /usr/share/gradle* \
                       /usr/share/maven* \
                       /usr/share/sbt \
                       /usr/local/aws* \
                       /usr/local/sqlpackage \
                       /opt/az \
                       /opt/containerd \
                       /var/lib/docker \
                       /var/lib/containerd \
                       /usr/lib/firefox \
                       /opt/google/chrome \
                       /usr/local/.ghcup \
                       /usr/share/swift \
                       /usr/local/julia* \
                       /usr/lib/jvm/temurin-* \
                       /usr/lib/jvm/adoptopenjdk-* \
                       /usr/lib/jvm/java-17* \
                       /usr/lib/jvm/java-21* \
                       /usr/share/doc/* \
                       /usr/share/man/* \
                       /var/log/* 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/* /tmp/*

          sudo fallocate -l 1G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          sudo mkdir -p /mnt/lineage /var/tmp/ccache /out/lineage
          sudo chown -R $USER:$USER /mnt /var/tmp/ccache /out

          echo "=== Dung lượng sau khi dọn ==="
          df -h / /mnt
          free -h

      - name: Cài đặt công cụ biên dịch & Repo
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex fontconfig g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libfreetype6 liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop p7zip-full pngcrush python3 python3-protobuf \
            python-is-python3 rsync schedtool squashfs-tools tar unzip xsltproc xz-utils zip \
            zlib1g-dev ca-certificates wget
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          sudo rm -rf /var/lib/apt/lists/* /tmp/*
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Khôi phục CCache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: /var/tmp/ccache
          key: ccache-gta2slte-${{ github.run_id }}
          restore-keys: |
            ccache-gta2slte-

      - name: Đồng bộ mã nguồn LineageOS 18.1 & Device Tree (gta2slte)
        working-directory: /mnt/lineage
        run: |
          git config --global user.email "Ducthinh2014123@users.noreply.github.com"
          git config --global user.name "Ducthinh2014123"
          git config --global color.ui false

          repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --depth=1 --git-lfs
          mkdir -p .repo/local_manifests

          cat << 'EOF' > .repo/local_manifests/gta2slte.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="Ducthinh2014123/android_device_samsung_gta2slte" path="device/samsung/gta2slte" remote="github" revision="lineage-18.1" />
            <project name="Ducthinh2014123/proprietary_vendor_samsung_gta2slte" path="vendor/samsung/gta2slte" remote="github" revision="lineage-18.1" />
            <project name="Ducthinh2014123/android_kernel_samsung_msm8937" path="kernel/samsung/msm8937" remote="github" revision="lineage-18.1" />
            <project name="LineageOS/android_hardware_samsung" path="hardware/samsung" remote="github" revision="lineage-18.1" />
            <project name="LineageOS/android_hardware_sony_timekeep" path="hardware/sony/timekeep" remote="github" revision="lineage-18.1" />
          </manifest>
          EOF

          python3 -c '
          import glob, xml.etree.ElementTree as ET
          skip_paths = (
              "developers/",
              "prebuilts/build-tools/darwin",
              "prebuilts/clang/host/darwin",
              "prebuilts/gcc/darwin",
              "prebuilts/gcc/linux-x86/mips",
              "prebuilts/gcc/linux-x86/x86",
              "prebuilts/gdb/darwin",
              "prebuilts/go/darwin",
              "prebuilts/python/darwin",
              "prebuilts/qemu-kernel",
              "prebuilts/android-emulator",
              "prebuilts/maven_repo",
              "prebuilts/gradle-plugin",
          )
          names = set()
          for f in glob.glob(".repo/manifests/**/*.xml", recursive=True):
              try:
                  for p in ET.parse(f).getroot().findall(".//project"):
                      path = p.get("path", "")
                      name = p.get("name", "")
                      if name and path.startswith(skip_paths):
                          names.add(name)
              except Exception:
                  pass
          with open(".repo/local_manifests/remove.xml", "w") as out:
              out.write("<manifest>\n")
              for n in sorted(names):
                  out.write(f"  <remove-project name=\"{n}\" />\n")
              out.write("</manifest>\n")
          print(f"Đã chặn {len(names)} project toolchain thừa.")
          '

          if ! repo sync -c -j$(nproc --all) --force-sync --no-tags --no-clone-bundle --optimized-fetch --prune --fail-fast --quiet > /mnt/repo-sync.log 2>&1; then
            echo "repo sync thất bại, hiển thị 200 dòng cuối của log:"
            tail -n 200 /mnt/repo-sync.log || true
            exit 1
          fi

          rm -rf .repo /mnt/repo-sync.log
          find /mnt/lineage -name ".git" -type d -exec rm -rf {} + 2>/dev/null || true
          # Giữ nguyên các toolchain Clang: RenderScript cần clang-3289846/bin/llvm-as.
          test -x prebuilts/clang/host/linux-x86/clang-3289846/bin/llvm-as || {
            echo "ERROR: Missing clang-3289846/bin/llvm-as required by RenderScript"
            exit 1
          }
          df -h / /mnt

      - name: Biên dịch ROM (Source trên /mnt, Out trên /)
        working-directory: /mnt/lineage
        env:
          ALLOW_MISSING_DEPENDENCIES: true
          WITH_DEXPREOPT_BOOT_IMG_AND_SYSTEM_SERVER_ONLY: true
          STRIP_EVERYTHING: true
          GOMAXPROCS: 2
          USE_CCACHE: 1
          CCACHE_COMPRESS: 1
          CCACHE_EXEC: /usr/bin/ccache
          CCACHE_DIR: /var/tmp/ccache
          CCACHE_BASEDIR: /mnt/lineage
          OUT_DIR_COMMON_BASE: /out
          _JAVA_OPTIONS: "-Xmx3g"
          LC_ALL: C
        run: |
          rm -rf hardware/ril/reference-ril
          ulimit -n 65535
          ccache -M 9G
          ccache -z

          (
            while true; do
              sleep 15
              AVAIL_ROOT=$(df -BG / | awk 'NR==2 {gsub("G",""); print $4}')
              echo "[DISK WATCH] Dung lượng trống hiện tại: ${AVAIL_ROOT}GB"

              if [ "$AVAIL_ROOT" -lt 12 ]; then
                echo "[DISK WATCH] Cảnh báo: dưới 12GB; không xóa artifact khi Ninja đang chạy."
              fi

              if [ "$AVAIL_ROOT" -lt 2 ]; then
                echo "[CẢNH BÁO] Dung lượng trống chạm đáy dưới 2GB — dừng ninja để bảo toàn CCache!"
                pkill -f ninja || true
                break
              fi
            done
          ) &
          WATCH_PID=$!

          set +e
          timeout 315m bash -c "source build/envsetup.sh && lunch lineage_gta2slte-userdebug && make -j2 ${{ github.event.inputs.build_target }}"
          BUILD_STATUS=$?
          set -e

          kill $WATCH_PID 2>/dev/null || true

          if [ $BUILD_STATUS -eq 124 ]; then
            echo "Đã chạm mốc 315 phút — chủ động dừng biên dịch để dọn out/ và lưu CCache!"
            exit 1
          fi
          exit $BUILD_STATUS

      - name: Đóng gói & Upload lên GitHub Releases
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lineage-18.1-gta2slte-${{ github.run_number }}
          name: LineageOS 18.1 Unofficial - SM-T385 (${{ github.run_number }})
          fail_on_unmatched_files: false
          files: |
            /out/lineage/target/product/gta2slte/lineage-18.1-*.zip
            /out/lineage/target/product/gta2slte/lineage-18.1-*.zip.sha256sum
            /out/lineage/target/product/gta2slte/boot.img
            /out/lineage/target/product/gta2slte/recovery.img

      - name: Đính kèm file ROM trực tiếp vào Build (Artifacts)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-18.1-gta2slte-${{ github.run_number }}
          path: |
            /out/lineage/target/product/gta2slte/lineage-18.1-*.zip
            /out/lineage/target/product/gta2slte/lineage-18.1-*.zip.sha256sum
            /out/lineage/target/product/gta2slte/boot.img
            /out/lineage/target/product/gta2slte/recovery.img
          retention-days: 7
          if-no-files-found: warn

      - name: Dọn sạch /mnt và /out sau khi upload để nén CCache không bị đầy đĩa
        if: always()
        run: |
          export CCACHE_DIR=/var/tmp/ccache
          command -v ccache >/dev/null 2>&1 && ccache -s || true
          rm -rf /mnt/lineage /out/lineage 2>/dev/null || true
          df -h /

      - name: Lưu lại CCache bất chấp build thành công hay dừng sớm
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /var/tmp/ccache
          key: ccache-gta2slte-${{ github.run_id }}
