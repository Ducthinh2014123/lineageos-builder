name: Build LineageOS 18.1 - gta2slte

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: Build target
        required: true
        default: bacon
        type: choice
        options:
          - bacon
          - systemimage
          - bootimage

permissions:
  contents: write

concurrency:
  group: lineage-gta2slte
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      SOURCE_DIR: /mnt/lineage
      OUT_DIR_COMMON_BASE: /out
      CCACHE_DIR: /var/tmp/ccache
      CCACHE_BASEDIR: /mnt/lineage
      USE_CCACHE: '1'
      CCACHE_COMPRESS: '1'
      ALLOW_MISSING_DEPENDENCIES: 'false'
      BUILD_TARGET: ${{ inputs.build_target }}
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Minimize GitHub runner (preserve existing swap)
        run: |
          set -euo pipefail
          echo '=== Initial disk ==='
          df -hT / /mnt /var/tmp
          free -h
          # Preserve existing runner swap; do not create any new swapfile.
          sudo systemctl stop docker.service docker.socket containerd.service 2>/dev/null || true

          # Purge only explicitly selected optional packages; do not autoremove.
          packages=(
            mono-complete mono-devel mono-runtime powershell azure-cli
            google-cloud-cli google-chrome-stable microsoft-edge-stable
            firefox chromium-browser maven ant ant-optional sbt
            podman buildah skopeo terraform packer kubectl helm
          )
          installed=()
          for pkg in "${packages[@]}"; do
            if dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -qx 'install ok installed'; then
              installed+=("$pkg")
            fi
          done
          if ((${#installed[@]})); then
            sudo apt-get -s purge "${installed[@]}" | tee /tmp/lineage-purge-plan.log
            if grep -Eq '^Rem (bash|coreutils|git|python3|nodejs|libc6|sudo|apt|curl|gradle|openjdk-[0-9]+-(jdk|jre)|ca-certificates)( |:)' /tmp/lineage-purge-plan.log; then
              echo '::warning::Unsafe APT purge plan; skipping package purge'
            else
              sudo apt-get purge -y "${installed[@]}"
            fi
          fi

          # Paths are host-only SDKs. Never touch Android source prebuilts.
          paths=(
            /usr/share/dotnet /usr/share/powershell /opt/microsoft/powershell
            /usr/local/share/powershell /opt/az /usr/local/aws-cli
            /usr/local/aws-sam-cli /usr/local/google-cloud-sdk
            /opt/google-cloud-sdk /usr/local/lib/android
            /usr/share/swift /usr/local/swift /usr/local/julia /opt/ghc
            /opt/kotlinc /usr/local/kotlinc /usr/share/miniconda
            /opt/conda /home/linuxbrew /usr/local/share/vcpkg
            /opt/google/chrome /opt/microsoft/msedge
            /usr/local/share/chromium /usr/local/share/chromedriver-linux64
            /usr/local/share/geckodriver /usr/local/share/edge_driver
            /var/lib/docker /var/lib/containerd /var/lib/containers
            /usr/local/share/terraform /usr/local/share/pulumi /opt/pulumi
            /opt/maven /opt/apache-maven /opt/ant /opt/apache-ant /opt/sbt
            /usr/share/maven /usr/share/ant /usr/share/sbt
            /opt/hostedtoolcache/Go /opt/hostedtoolcache/go
            /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Julia
          )
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then
              echo "Removing $path"
              sudo du -sh "$path" 2>/dev/null || true
              sudo rm -rf -- "$path"
            fi
          done
          sudo apt-get clean
          # Do not delete runner, hosted Node/Python/Java, /usr/lib, or /tmp.
          for cmd in bash git curl python3 node sudo tar gzip df awk; do
            command -v "$cmd"
          done
          echo '=== Disk after cleanup ==='
          df -hT /
          free -h

      - name: Wipe /mnt contents before source sync
        shell: bash
        run: |
          set -euo pipefail
          echo '=== /mnt BEFORE ==='
          df -hT / /mnt
          ls -la /mnt

          # Never erase mounted volumes or an active swapfile.
          if findmnt -rn -o TARGET | awk '$1 ~ /^\/mnt\// {found=1} END {exit !found}'; then
            echo '::error::A filesystem is mounted below /mnt; refusing blanket wipe'
            findmnt -R /mnt || true
            exit 1
          fi
          if swapon --noheadings --show=NAME | grep -Eq '^/mnt(/|$)'; then
            echo '::error::Active swap exists in /mnt; refusing blanket wipe'
            swapon --show
            exit 1
          fi

          # Requested full wipe of /mnt children (not /mnt itself).
          sudo rm -rf -- /mnt/*

          echo '=== /mnt AFTER ==='
          df -hT / /mnt
          ls -la /mnt

      - name: Prepare directories
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/lineage /mnt/build-logs /out/lineage /var/tmp/ccache
          sudo chown -R "$USER:$USER" /mnt/lineage /mnt/build-logs /out /var/tmp/ccache
          df -hT / /mnt /out /var/tmp

      - name: Install LineageOS dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache curl file flex \
            fontconfig g++-multilib gcc-multilib git git-lfs gnupg gperf \
            imagemagick kmod lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            libdw-dev libelf-dev libfreetype6 libgnutls28-dev liblz4-tool \
            libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lz4 lzop openjdk-11-jdk-headless p7zip-full \
            pngcrush protobuf-compiler python3 python3-protobuf \
            python-is-python3 rsync schedtool squashfs-tools tar unzip \
            wget xxd xsltproc xz-utils zip zlib1g-dev
          sudo apt-get clean
          git lfs install
          java -version
          python3 --version
          if command -v gradle >/dev/null 2>&1; then
            echo 'Host Gradle preserved:'
            command -v gradle
          fi
          df -hT /

      - name: Install Android repo tool
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fL --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" version

      - name: Restore CCache
        uses: actions/cache/restore@v4
        with:
          path: /var/tmp/ccache
          key: ccache-gta2slte-6gb-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-gta2slte-6gb-

      - name: Configure CCache
        run: |
          set -euo pipefail
          ccache -M 6G
          ccache -c
          ccache -z
          ccache -s
          df -hT /

      - name: Initialize LineageOS source
        working-directory: /mnt/lineage
        run: |
          set -euo pipefail
          git config --global user.name 'LineageOS Builder'
          git config --global user.email 'builder@users.noreply.github.com'
          git config --global color.ui false
          repo init -u https://github.com/LineageOS/android.git \
            -b lineage-18.1 --depth=1 --git-lfs
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/gta2slte.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="github-local" fetch="https://github.com/" />
            <project name="Ducthinh2014123/android_device_samsung_gta2slte"
                     path="device/samsung/gta2slte"
                     remote="github-local" revision="lineage-18.1" />
            <project name="Ducthinh2014123/proprietary_vendor_samsung_gta2slte"
                     path="vendor/samsung/gta2slte"
                     remote="github-local" revision="lineage-18.1" />
            <project name="Ducthinh2014123/android_kernel_samsung_msm8937"
                     path="kernel/samsung/msm8937"
                     remote="github-local" revision="lineage-18.1" />
            <project name="LineageOS/android_hardware_samsung"
                     path="hardware/samsung"
                     remote="github-local" revision="lineage-18.1" />
            <project name="LineageOS/android_hardware_sony_timekeep"
                     path="hardware/sony/timekeep"
                     remote="github-local" revision="lineage-18.1" />
          </manifest>
          EOF
          repo manifest -o /mnt/build-logs/manifest.xml

      - name: Sync LineageOS with disk watchdog
        working-directory: /mnt/lineage
        run: |
          set -euo pipefail
          if [ "$(df -Pk / | awk 'NR==2 {print $4}')" -lt 716800 ]; then
            echo '::error::Less than 700 MiB free before sync'
            exit 1
          fi
          setsid bash -c 'exec repo sync -c -j2 --no-tags --no-clone-bundle --optimized-fetch --prune --fail-fast' \
            > /mnt/build-logs/repo-sync.log 2>&1 &
          pid=$!
          (
            while kill -0 "$pid" 2>/dev/null; do
              free_kb=$(df -Pk / | awk 'NR==2 {print $4}')
              if [ "$free_kb" -lt 716800 ]; then
                echo '::error::Disk below 700 MiB during sync'
                touch /mnt/build-logs/sync-disk-critical
                kill -TERM -- "-$pid" 2>/dev/null || true
                sleep 3
                kill -KILL -- "-$pid" 2>/dev/null || true
                break
              fi
              sleep 5
            done
          ) &
          watcher=$!
          set +e
          wait "$pid"
          status=$?
          set -e
          kill "$watcher" 2>/dev/null || true
          wait "$watcher" 2>/dev/null || true
          tail -n 80 /mnt/build-logs/repo-sync.log || true
          if [ -f /mnt/build-logs/sync-disk-critical ]; then exit 1; fi
          exit "$status"

      - name: Verify source
        working-directory: /mnt/lineage
        run: |
          set -euo pipefail
          for path in \
            build/envsetup.sh build/soong \
            device/samsung/gta2slte vendor/samsung/gta2slte \
            kernel/samsung/msm8937 tools/metalava; do
            test -e "$path" || { echo "::error::Missing $path"; exit 1; }
          done
          df -hT / /mnt /out
          du -sh /mnt/lineage /var/tmp/ccache || true

      - name: Resolve AOSP reference RIL vs Samsung vendor blobs
        working-directory: /mnt/lineage
        run: |
          set -euo pipefail
          reference_mk=hardware/ril/reference-ril/Android.mk
          vendor_mk=vendor/samsung/gta2slte/gta2slte-vendor.mk
          mkdir -p /mnt/build-logs

          echo '=== Samsung RIL vendor blob copy entries ==='
          grep -nE 'libreference-ril\.so|/libril\.so|libsec-ril\.so' "$vendor_mk" \
            | tee /mnt/build-logs/ril-vendor-entries.txt || true

          echo '=== AOSP libril module definitions ==='
          grep -RInE --include='Android.mk' --include='Android.bp' \
            'LOCAL_MODULE[[:space:]]*:=[[:space:]]*libril([[:space:]]|$)|name:[[:space:]]*"libril"' \
            hardware/ril 2>/dev/null \
            | tee /mnt/build-logs/libril-module-definitions.txt || true

          if [ ! -f "$reference_mk" ]; then
            echo 'AOSP reference-ril Android.mk absent; no change needed.'
          elif [ -s /mnt/build-logs/libril-module-definitions.txt ]; then
            echo 'AOSP libril module exists; preserving reference-ril build.'
          else
            echo 'AOSP libril module absent: disabling ONLY reference-ril source build.'
            echo 'Samsung proprietary RIL .so files and vendor copy rules remain intact.'
            mv -- "$reference_mk" "${reference_mk}.disabled"
          fi

          echo '=== RIL package requests (diagnostic only) ==='
          grep -RInE --include='*.mk' 'libreference-ril|libril' \
            device/samsung/gta2slte vendor/samsung/gta2slte \
            2>/dev/null | head -60 || true

      - name: Build LineageOS with full nproc and disk watchdog
        working-directory: /mnt/lineage
        run: |
          set -euo pipefail
          jobs=$(nproc)
          echo "Building $BUILD_TARGET with -j$jobs"
          free -h
          if [ "$(df -Pk / | awk 'NR==2 {print $4}')" -lt 716800 ]; then
            echo '::error::Less than 700 MiB free before build'
            exit 1
          fi
          ulimit -n 65535 || true
          export JOBS="$jobs"
          setsid timeout --signal=TERM --kill-after=15s 315m bash -c '
            set -eo pipefail
            source build/envsetup.sh
            lunch lineage_gta2slte-userdebug
            make -j"$JOBS" "$BUILD_TARGET"
          ' > /mnt/build-logs/build.log 2>&1 &
          pid=$!
          (
            while kill -0 "$pid" 2>/dev/null; do
              free_kb=$(df -Pk / | awk 'NR==2 {print $4}')
              echo "Free disk: $((free_kb / 1024)) MiB"
              if [ "$free_kb" -lt 716800 ]; then
                echo '::error::Disk below 700 MiB during build'
                touch /mnt/build-logs/build-disk-critical
                kill -TERM -- "-$pid" 2>/dev/null || true
                sleep 3
                kill -KILL -- "-$pid" 2>/dev/null || true
                break
              fi
              sleep 5
            done
          ) &
          watcher=$!
          set +e
          wait "$pid"
          status=$?
          set -e
          kill "$watcher" 2>/dev/null || true
          wait "$watcher" 2>/dev/null || true
          tail -n 150 /mnt/build-logs/build.log || true
          ccache -s || true
          df -hT /
          if [ -f /mnt/build-logs/build-disk-critical ]; then exit 1; fi
          exit "$status"

      - name: Verify output
        if: success()
        run: |
          set -euo pipefail
          product_dir=/out/lineage/target/product/gta2slte
          test -d "$product_dir"
          ls -lh "$product_dir"
          case "$BUILD_TARGET" in
            bacon)
              compgen -G "$product_dir/lineage-18.1-*.zip" >/dev/null
              ;;
            systemimage)
              test -f "$product_dir/system.img"
              ;;
            bootimage)
              test -f "$product_dir/boot.img"
              ;;
          esac

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-18.1-gta2slte-${{ github.run_number }}
          path: |
            /out/lineage/target/product/gta2slte/lineage-18.1-*.zip
            /out/lineage/target/product/gta2slte/boot.img
            /out/lineage/target/product/gta2slte/recovery.img
            /out/lineage/target/product/gta2slte/system.img
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lineage-18.1-gta2slte-${{ github.run_number }}
          name: LineageOS 18.1 gta2slte Build ${{ github.run_number }}
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            /out/lineage/target/product/gta2slte/lineage-18.1-*.zip
            /out/lineage/target/product/gta2slte/boot.img
            /out/lineage/target/product/gta2slte/recovery.img
            /out/lineage/target/product/gta2slte/system.img

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-Logs-${{ github.run_number }}
          path: |
            /mnt/build-logs/*.log
            /mnt/build-logs/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare CCache for saving
        if: always()
        run: |
          ccache -M 6G || true
          ccache -c || true
          ccache -s || true
          df -hT /

      - name: Save CCache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /var/tmp/ccache
          key: ccache-gta2slte-6gb-${{ github.run_id }}-${{ github.run_attempt }}
