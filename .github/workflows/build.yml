name: Build LineageOS 18.1 (gta2slte)

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Mục tiêu build (mặc định: bacon)'
        required: true
        default: 'bacon'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 315

    steps:
      - name: Dọn dẹp sâu ổ / (~60GB trống) và cấu hình 4GB Swap trên /mnt
        run: |
          echo "=== Dung lượng trước khi dọn ==="
          df -h / /mnt

          # Tắt swap mặc định và xóa các gói khổng lồ không dùng tới trên ổ /
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo rm -rf /usr/share/dotnet \
                       /usr/local/lib/android \
                       /opt/ghc \
                       /opt/hostedtoolcache/CodeQL \
                       /usr/local/share/boost \
                       /usr/local/share/chromium \
                       /usr/share/miniconda \
                       /usr/local/aws* \
                       /usr/local/sqlpackage \
                       /opt/az \
                       /usr/lib/firefox \
                       /opt/google/chrome \
                       /usr/local/.ghcup \
                       /usr/share/swift \
                       /usr/local/julia*
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/* /tmp/*

          # Tạo 4GB Swap trên /mnt để gánh cụm Java/Metalava
          sudo fallocate -l 4G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          # Chuẩn bị thư mục làm việc
          sudo mkdir -p /mnt/lineage /mnt/ccache /out/lineage
          sudo chown -R $USER:$USER /mnt/lineage /mnt/ccache /out/lineage

          echo "=== Dung lượng sau khi dọn ==="
          df -h / /mnt
          free -h

      - name: Cài đặt công cụ biên dịch & Repo
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Khôi phục CCache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/ccache
          key: ccache-gta2slte-${{ github.run_id }}
          restore-keys: |
            ccache-gta2slte-

      - name: Đồng bộ mã nguồn LineageOS 18.1 & Device Tree (gta2slte)
        working-directory: /mnt/lineage
        run: |
          git config --global user.email "builder@github.actions"
          git config --global user.name "Lineage Builder"
          git config --global color.ui false

          repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --depth=1 --git-lfs
          mkdir -p .repo/local_manifests

          # Thay link repo device/kernel/vendor của bạn vào bên dưới nếu dùng fork riêng
          cat << 'EOF' > .repo/local_manifests/roomservice.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="Ducthinh2014123/android_device_samsung_gta2slte" path="device/samsung/gta2slte" remote="github" revision="lineage-18.1" />
            <project name="Ducthinh2014123/android_device_samsung_msm8937-common" path="device/samsung/msm8937-common" remote="github" revision="lineage-18.1" />
            <project name="Ducthinh2014123/android_kernel_samsung_msm8937" path="kernel/samsung/msm8937" remote="github" revision="lineage-18.1" />
            <project name="Ducthinh2014123/proprietary_vendor_samsung" path="vendor/samsung" remote="github" revision="lineage-18.1" />
          </manifest>
          EOF

          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

          # Xóa thư mục .repo sau khi sync để giải phóng thêm ~12GB trên /mnt
          rm -rf .repo

      - name: Biên dịch ROM (Source trên /mnt, Out trên /)
        working-directory: /mnt/lineage
        env:
          USE_CCACHE: 1
          CCACHE_EXEC: /usr/bin/ccache
          CCACHE_DIR: /mnt/ccache
          OUT_DIR_COMMON_BASE: /out
          _JAVA_OPTIONS: "-Xmx4g"
          LC_ALL: C
        run: |
          ccache -M 10G

          # Chạy luồng giám sát ổ đĩa: tự dọn file rác trung gian nếu trống < 6GB, chỉ dừng khi < 1.5GB
          (
            CLEANED_SYMBOLS=0
            while true; do
              sleep 20
              AVAIL_ROOT=$(df -BG / | awk 'NR==2 {gsub("G",""); print $4}')
              AVAIL_MNT=$(df -BG /mnt | awk 'NR==2 {gsub("G",""); print $4}')
              echo "[DISK WATCH] Trống trên / (out): ${AVAIL_ROOT}GB | Trống trên /mnt (src): ${AVAIL_MNT}GB"

              if [ "$AVAIL_ROOT" -lt 7 ] && [ "$CLEANED_SYMBOLS" -eq 0 ]; then
                echo "[AUTO CLEAN] Ổ / dưới 7GB — xóa symbols và file đối tượng trung gian để lấy chỗ đóng gói ROM..."
                rm -rf /out/lineage/target/product/gta2slte/symbols
                find /out/lineage/target/product/gta2slte/obj/STATIC_LIBRARIES -name "*.o" -delete 2>/dev/null || true
                CLEANED_SYMBOLS=1
                df -h /
              fi

              if [ "$AVAIL_ROOT" -lt 2 ] || [ "$AVAIL_MNT" -lt 2 ]; then
                echo "[CẢNH BÁO] Dung lượng trống chạm đáy dưới 2GB — dừng ninja để bảo toàn CCache!"
                pkill -f ninja || true
                break
              fi
            done
          ) &
          WATCH_PID=$!

          source build/envsetup.sh
          lunch lineage_gta2slte-userdebug
          mka ${{ github.event.inputs.build_target }}
          BUILD_STATUS=$?

          kill $WATCH_PID 2>/dev/null || true
          exit $BUILD_STATUS

      - name: Đóng gói & Upload lên GitHub Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lineage-18.1-gta2slte-${{ github.run_number }}
          name: LineageOS 18.1 Unofficial - SM-T385 (${{ github.run_number }})
          files: |
            /out/lineage/target/product/gta2slte/lineage-18.1-*.zip
            /out/lineage/target/product/gta2slte/lineage-18.1-*.zip.sha256sum
            /out/lineage/target/product/gta2slte/recovery.img

      - name: Đính kèm file ROM trực tiếp vào Build (Artifacts)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-18.1-gta2slte-${{ github.run_number }}
          path: |
            /out/lineage/target/product/gta2slte/lineage-18.1-*.zip
            /out/lineage/target/product/gta2slte/lineage-18.1-*.zip.sha256sum
          retention-days: 7

      - name: Lưu lại CCache bất chấp build thành công hay dừng sớm
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/ccache
          key: ccache-gta2slte-${{ github.run_id }}
