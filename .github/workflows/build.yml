
name: Build LineageOS 18.1 (gta2slte)

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Build target"
        required: true
        default: bacon
        type: choice
        options:
          - bacon
          - systemimage
          - bootimage

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:
      SOURCE_DIR: /mnt/lineage
      OUT_DIR: /out/lineage
      CCACHE_DIR: /var/tmp/ccache
      CCACHE_BASEDIR: /mnt/lineage
      CCACHE_EXEC: /usr/bin/ccache
      USE_CCACHE: "1"
      CCACHE_COMPRESS: "1"
      ALLOW_MISSING_DEPENDENCIES: "false"
      WITH_DEXPREOPT_BOOT_IMG_AND_SYSTEM_SERVER_ONLY: "true"
      GOMAXPROCS: "2"
      LC_ALL: C

    steps:
      - name: Free disk space and prepare directories
        run: |
          set -euo pipefail

          echo "=== Initial disk space ==="
          df -h / /mnt

          sudo swapoff -a || true

          sudo systemctl stop \
            docker docker.socket containerd \
            2>/dev/null || true

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/vcpkg \
            /usr/share/miniconda \
            /usr/share/gradle \
            /usr/share/maven \
            /usr/share/sbt \
            /opt/az \
            /var/lib/docker \
            /var/lib/containerd \
            /usr/share/swift \
            /usr/local/julia* \
            2>/dev/null || true

          sudo apt-get clean

          sudo mkdir -p \
            /mnt/lineage \
            /mnt/build-logs \
            /out/lineage \
            /var/tmp/ccache

          sudo chown -R \
            "$USER:$USER" \
            /mnt/lineage \
            /mnt/build-logs \
            /out \
            /var/tmp/ccache

          echo "=== Disk after cleanup ==="
          df -h / /mnt

      - name: Configure 2GB swap
        run: |
          set -euo pipefail

          sudo fallocate -l 2G /mnt/lineage-swapfile
          sudo chmod 600 /mnt/lineage-swapfile
          sudo mkswap /mnt/lineage-swapfile
          sudo swapon /mnt/lineage-swapfile

          free -h

      - name: Install build dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            fontconfig \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libfreetype6 \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            p7zip-full \
            pngcrush \
            python3 \
            python3-protobuf \
            python-is-python3 \
            rsync \
            schedtool \
            squashfs-tools \
            tar \
            unzip \
            xsltproc \
            xz-utils \
            zip \
            zlib1g-dev \
            ca-certificates \
            wget \
            openjdk-11-jdk

          sudo apt-get clean

          mkdir -p "$HOME/bin"

          curl -fL --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          java -version
          python3 --version

      - name: Restore CCache
        uses: actions/cache/restore@v4
        with:
          path: /var/tmp/ccache
          key: ccache-gta2slte-${{ github.run_id }}
          restore-keys: |
            ccache-gta2slte-

      - name: Initialize LineageOS source
        working-directory: /mnt/lineage
        run: |
          set -euo pipefail

          git config --global \
            user.email \
            "Ducthinh2014123@users.noreply.github.com"

          git config --global \
            user.name \
            "Ducthinh2014123"

          git config --global color.ui false

          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-18.1 \
            --depth=1 \
            --git-lfs

          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/gta2slte.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="Ducthinh2014123/android_device_samsung_gta2slte"
                     path="device/samsung/gta2slte"
                     remote="github"
                     revision="lineage-18.1" />
            <project name="Ducthinh2014123/proprietary_vendor_samsung_gta2slte"
                     path="vendor/samsung/gta2slte"
                     remote="github"
                     revision="lineage-18.1" />
            <project name="Ducthinh2014123/android_kernel_samsung_msm8937"
                     path="kernel/samsung/msm8937"
                     remote="github"
                     revision="lineage-18.1" />
            <project name="LineageOS/android_hardware_samsung"
                     path="hardware/samsung"
                     remote="github"
                     revision="lineage-18.1" />
            <project name="LineageOS/android_hardware_sony_timekeep"
                     path="hardware/sony/timekeep"
                     remote="github"
                     revision="lineage-18.1" />
          </manifest>
          EOF

      - name: Configure safe manifest exclusions
        working-directory: /mnt/lineage
        run: |
          set -euo pipefail

          python3 <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          skip_paths = (
              "developers/",
              "prebuilts/build-tools/darwin",
              "prebuilts/clang/host/darwin",
              "prebuilts/gcc/darwin",
              "prebuilts/gcc/linux-x86/mips",
              "prebuilts/gcc/linux-x86/x86",
              "prebuilts/gdb/darwin",
              "prebuilts/go/darwin",
              "prebuilts/python/darwin",
              "prebuilts/qemu-kernel",
              "prebuilts/android-emulator",
          )

          names = set()

          for filename in glob.glob(
              ".repo/manifests/**/*.xml",
              recursive=True
          ):
              try:
                  root = ET.parse(filename).getroot()
                  for project in root.findall(".//project"):
                      path = project.get("path", "")
                      name = project.get("name", "")
                      if name and path.startswith(skip_paths):
                          names.add(name)
              except ET.ParseError:
                  continue

          with open(
              ".repo/local_manifests/remove.xml", "w"
          ) as output:
              output.write("<manifest>\n")
              for name in sorted(names):
                  output.write(
                      f'  <remove-project name="{name}" />\n'
                  )
              output.write("</manifest>\n")

          print(f"Excluded projects: {len(names)}")
          print("Gradle plugin prebuilts: PRESERVED")
          PY

      - name: Sync LineageOS source
        working-directory: /mnt/lineage
        run: |
          set -euo pipefail

          echo "=== Syncing source ==="

          mkdir -p /mnt/build-logs

          if ! repo sync \
            -c \
            -j4 \
            --force-sync \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune \
            --fail-fast \
            > /mnt/build-logs/repo-sync.log 2>&1; then

            echo "::error::Repository sync failed"
            tail -n 200 /mnt/build-logs/repo-sync.log
            exit 1
          fi

          echo "=== Sync completed ==="
          df -h / /mnt

      - name: Validate critical dependencies
        working-directory: /mnt/lineage
        run: |
          set -euo pipefail

          echo "=== RenderScript LLVM ==="

          LLVM_AS=prebuilts/clang/host/linux-x86/clang-3289846/bin/llvm-as

          if [ ! -x "$LLVM_AS" ]; then
            echo "::error::Missing RenderScript llvm-as"
            exit 1
          fi

          echo "=== Glide Maven dependency ==="

          GLIDE_JAR=prebuilts/maven_repo/bumptech/com/github/bumptech/glide/glide/SNAPSHOT/glide-SNAPSHOT.jar

          if [ ! -f "$GLIDE_JAR" ]; then
            echo "::error::Missing Glide dependency"
            exit 1
          fi

          echo "=== Gradle plugin prebuilts ==="

          if [ ! -d prebuilts/gradle-plugin ]; then
            echo "::error::Missing Gradle plugin prebuilts"
            exit 1
          fi

          echo "=== Metalava ==="

          if [ ! -f tools/metalava/Android.bp ]; then
            echo "::error::Missing Metalava Android.bp"
            exit 1
          fi

          echo "=== Metalava Gradle dependency ==="

          grep -R -n -m 5 \
            "metalava-gradle-plugin-deps" \
            tools/metalava \
            prebuilts/gradle-plugin \
            | head -30 || true

          echo "Critical dependency validation completed."

      - name: Configure CCache
        run: |
          set -euo pipefail

          ccache -M 4G
          ccache -z
          ccache -s

      - name: Build ROM
        working-directory: /mnt/lineage
        env:
          OUT_DIR_COMMON_BASE: /out
          _JAVA_OPTIONS: "-Xmx3g"
          BUILD_TARGET: ${{ inputs.build_target }}
        run: |
          set -euo pipefail

          echo "=== Build target: $BUILD_TARGET ==="

          ulimit -n 65535 || true

          rm -rf hardware/ril/reference-ril

          mkdir -p /mnt/build-logs

          (
            while true; do
              sleep 30

              ROOT_FREE=$(df -Pk / | awk 'NR==2 {print $4}')
              MNT_FREE=$(df -Pk /mnt | awk 'NR==2 {print $4}')

              echo "[DISK WATCH] root=${ROOT_FREE}KB mnt=${MNT_FREE}KB"

              if [ "$ROOT_FREE" -lt 12582912 ]; then
                echo "::warning::Root disk below 12 GiB"
              fi

              if [ "$MNT_FREE" -lt 5242880 ]; then
                echo "::warning::Mount disk below 5 GiB"
              fi
            done
          ) &

          WATCH_PID=$!

          cleanup_watch() {
            kill "$WATCH_PID" 2>/dev/null || true
            wait "$WATCH_PID" 2>/dev/null || true
          }

          trap cleanup_watch EXIT

          set +e

          timeout 315m bash -c '
            set -o pipefail
            source build/envsetup.sh
            lunch lineage_gta2slte-userdebug
            make -j2 "$BUILD_TARGET"
          ' 2>&1 | tee /mnt/build-logs/build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          set -e

          echo "=== Build exit code: $BUILD_STATUS ==="

          ccache -s || true
          df -h / /mnt

          if [ "$BUILD_STATUS" -eq 124 ]; then
            echo "::error::Build exceeded 315 minutes"
            exit 124
          fi

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::LineageOS build failed"
            tail -n 150 /mnt/build-logs/build.log
            exit "$BUILD_STATUS"
          fi

          echo "Build completed successfully."

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-Build-Logs-${{ github.run_number }}
          path: |
            /mnt/build-logs/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lineage-18.1-gta2slte-${{ github.run_number }}
          name: LineageOS 18.1 Unofficial - SM-T385 (${{ github.run_number }})
          fail_on_unmatched_files: false
          files: |
            /out/lineage/target/product/gta2slte/lineage-18.1-*.zip
            /out/lineage/target/product/gta2slte/lineage-18.1-*.zip.sha256sum
            /out/lineage/target/product/gta2slte/boot.img
            /out/lineage/target/product/gta2slte/recovery.img

      - name: Upload ROM artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-18.1-gta2slte-${{ github.run_number }}
          path: |
            /out/lineage/target/product/gta2slte/lineage-18.1-*.zip
            /out/lineage/target/product/gta2slte/lineage-18.1-*.zip.sha256sum
            /out/lineage/target/product/gta2slte/boot.img
            /out/lineage/target/product/gta2slte/recovery.img
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup source and output
        if: always()
        run: |
          export CCACHE_DIR=/var/tmp/ccache

          ccache -s || true

          sudo swapoff /mnt/lineage-swapfile || true
          sudo rm -f /mnt/lineage-swapfile

          rm -rf /mnt/lineage /out/lineage || true

          df -h / /mnt

      - name: Save CCache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /var/tmp/ccache
          key: ccache-gta2slte-${{ github.run_id }}
