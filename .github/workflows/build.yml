name: Build LineageOS 18.1 for gta2slte

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Mục tiêu build (bootimage để test nhanh, bacon để build full ROM)'
        required: true
        default: 'bacon'
        type: choice
        options:
          - bacon
          - bootimage

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Giải phóng dung lượng ổ cứng Runner (~165GB trống)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/share/powershell /usr/local/aws-cli /usr/local/google-cloud-sdk /usr/share/swift
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Cài đặt công cụ build & Repo
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          git config --global user.name "Ducthinh2014123"
          git config --global user.email "Ducthinh2014123@users.noreply.github.com"

      - name: Tạo Swap 8GB
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Khôi phục CCache (nếu có từ lần chạy trước)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-gta2slte-${{ github.run_id }}
          restore-keys: |
            ccache-gta2slte-

      - name: Khởi tạo & Sync mã nguồn LineageOS 18.1 (Shallow)
        run: |
          export PATH="$HOME/.bin:$PATH"
          mkdir -p ~/lineage/.repo/local_manifests
          cd ~/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --depth=1 --git-lfs
          cat << 'EOF' > .repo/local_manifests/gta2slte.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="Ducthinh2014123/android_device_samsung_gta2slte" path="device/samsung/gta2slte" remote="github" revision="lineage-18.1" />
            <project name="Ducthinh2014123/proprietary_vendor_samsung_gta2slte" path="vendor/samsung/gta2slte" remote="github" revision="lineage-18.1" />
            <project name="Ducthinh2014123/android_kernel_samsung_msm8937" path="kernel/samsung/msm8937" remote="github" revision="lineage-18.1" />
            <project name="LineageOS/android_hardware_samsung" path="hardware/samsung" remote="github" revision="lineage-18.1" />
          </manifest>
          EOF
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch --prune -j$(nproc)
          rm -rf .repo/projects/* .repo/project-objects/*
          df -h

      - name: Biên dịch ROM (mka ${{ github.event.inputs.build_target }})
        run: |
          cd ~/lineage
          rm -rf hardware/ril/reference-ril
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 15G
          source build/envsetup.sh
          lunch lineage_gta2slte-userdebug
          mka ${{ github.event.inputs.build_target }}

      - name: Đóng gói & Upload lên GitHub Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LineageOS 18.1 gta2slte (${{ github.event.inputs.build_target }} #${{ github.run_number }})
          files: |
            ~/lineage/out/target/product/gta2slte/lineage-18.1-*.zip
            ~/lineage/out/target/product/gta2slte/boot.img
            ~/lineage/out/target/product/gta2slte/recovery.img
