name: Build LineageOS 18.1 for gta2slte (Dual-Partition 140GB)

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Mục tiêu build (bacon để build full ROM, systemimage để mồi CCache)'
        required: true
        default: 'bacon'
        type: choice
        options:
          - bacon
          - systemimage
          - bootimage

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    container:
      image: ubuntu:20.04
      options: --privileged

    steps:
      - name: Chia đôi ổ đĩa — Swap 2GB & CCache sang (/), Lineage sang (/mnt)
        run: |
          mkdir -p /mnt/lineage /var/tmp/ccache
          swapoff -a || true
          rm -f /swapfile /mnt/swapfile
          fallocate -l 2G /var/tmp/swapfile
          chmod 600 /var/tmp/swapfile
          mkswap /var/tmp/swapfile
          swapon /var/tmp/swapfile
          df -h / /mnt
          free -h

      - name: Cài đặt bộ công cụ build tối giản (~650MB)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 \
            ca-certificates wget
          ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true
          ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          rm -rf /var/lib/apt/lists/* /tmp/*
          mkdir -p /usr/local/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
          chmod a+x /usr/local/bin/repo
          git config --global user.name "Ducthinh2014123"
          git config --global user.email "Ducthinh2014123@users.noreply.github.com"

      - name: Khôi phục CCache từ lần chạy trước
        uses: actions/cache/restore@v4
        with:
          path: /var/tmp/ccache
          key: ccache-gta2slte-${{ github.run_id }}
          restore-keys: |
            ccache-gta2slte-

      - name: Sync mã nguồn & Dọn sạch rác prebuilts (~17GB source)
        run: |
          mkdir -p /mnt/lineage/.repo/local_manifests
          cd /mnt/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --depth=1 --git-lfs
          cat << 'EOF' > .repo/local_manifests/gta2slte.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="Ducthinh2014123/android_device_samsung_gta2slte" path="device/samsung/gta2slte" remote="github" revision="lineage-18.1" />
            <project name="Ducthinh2014123/proprietary_vendor_samsung_gta2slte" path="vendor/samsung/gta2slte" remote="github" revision="lineage-18.1" />
            <project name="Ducthinh2014123/android_kernel_samsung_msm8937" path="kernel/samsung/msm8937" remote="github" revision="lineage-18.1" />
            <project name="LineageOS/android_hardware_samsung" path="hardware/samsung" remote="github" revision="lineage-18.1" />
          </manifest>
          EOF
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch --prune -j4
          rm -rf .repo
          find prebuilts -maxdepth 4 -type d -name "darwin-x86" -exec rm -rf {} + || true
          rm -rf prebuilts/gcc/linux-x86/mips prebuilts/gcc/linux-x86/x86
          df -h / /mnt

      - name: Biên dịch ROM tối ưu dung lượng (Chặn timeout ở 315 phút)
        run: |
          cd /mnt/lineage
          rm -rf hardware/ril/reference-ril
          ulimit -n 65535
          export ALLOW_MISSING_DEPENDENCIES=true
          export WITH_DEXPREOPT_BOOT_IMG_AND_SYSTEM_SERVER_ONLY=true
          export STRIP_EVERYTHING=true
          export GOMAXPROCS=2
          export _JAVA_OPTIONS="-Xmx4g"
          export USE_CCACHE=1
          export CCACHE_COMPRESS=1
          export CCACHE_DIR=/var/tmp/ccache
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 8G
          ccache -z
          set +e
          timeout 315m bash -c "source build/envsetup.sh && lunch lineage_gta2slte-userdebug && mka ${{ github.event.inputs.build_target }}"
          STATUS=$?
          set -e
          if [ $STATUS -eq 124 ]; then
            echo "Đã chạm mốc 315 phút — chủ động dừng biên dịch để dọn out/ và lưu CCache!"
            exit 1
          elif [ $STATUS -ne 0 ]; then
            exit $STATUS
          fi

      - name: Đóng gói & Upload lên GitHub Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LineageOS 18.1 gta2slte (${{ github.event.inputs.build_target }} #${{ github.run_number }})
          fail_on_unmatched_files: false
          files: |
            /mnt/lineage/out/target/product/gta2slte/lineage-18.1-*.zip
            /mnt/lineage/out/target/product/gta2slte/boot.img
            /mnt/lineage/out/target/product/gta2slte/recovery.img

      - name: Dọn thư mục out nếu build lỗi hoặc dừng timeout để nén CCache
        if: failure()
        run: |
          export CCACHE_DIR=/var/tmp/ccache
          ccache -s
          rm -rf /mnt/lineage/out/*
          df -h / /mnt

      - name: Lưu lại CCache bất chấp build thành công hay thất bại
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /var/tmp/ccache
          key: ccache-gta2slte-${{ github.run_id }}
